name: 3. Special Targeted Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'SamFW Direct Download Link'
        required: true
      compression:
        description: 'Compression level'
        required: true
        default: '0'
        type: choice
        options:
        - '0'
        - '3'
        - '6'
        - '9'
      upload_destination:
        description: 'Upload destination'
        required: true
        default: 'gofile'
        type: choice
        options:
        - 'gofile'
        - 'github releases'
      show_all:
        description: 'Show app and priv-app paths and include configured matches in the output'
        type: boolean
        default: false
      output_name:
        description: 'Output package name (default: Apps)'
        required: false
        default: 'Apps'
      custom_targets:
        description: 'Overrides, e.g. app=Settings;etc=permissions/example.xml'
        required: false
        default: ''

jobs:
  extract:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free unused runner storage
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            xz-utils \
            lz4 \
            unzip \
            curl \
            android-sdk-libsparse-utils \
            e2fsprogs \
            f2fs-tools \
            python3 \
            "linux-modules-extra-$(uname -r)"

      - name: Record installed package versions
        run: |
          dpkg-query -W -f='${binary:Package}=${Version}\n' | grep -E '^(jq|xz-utils|lz4|unzip|curl|binutils|android-sdk-libsparse-utils|e2fsprogs|f2fs-tools|python3|linux-modules-extra|shellcheck)(:|[-=])' | sort

      - name: Make tools executable
        run: chmod +x tools/android-tools/* tools/erofs-utils/* upload_gofile.sh scripts/extract_targeted.sh

      - name: Run Targeted Extraction
        env:
          FIRMWARE_URL: ${{ inputs.url }}
          COMPRESSION: ${{ inputs.compression }}
          SHOW_ALL: ${{ inputs.show_all }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          CUSTOM_TARGETS: ${{ inputs.custom_targets }}
        run: |
          bash scripts/extract_targeted.sh \
            "$FIRMWARE_URL" \
            "$COMPRESSION" \
            "$SHOW_ALL" \
            "$OUTPUT_NAME" \
            "$CUSTOM_TARGETS"

      - name: Preserve extraction report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targeted-extraction-report
          path: output/extraction-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Get Firmware Info
        id: fwinfo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AP_CODE=$(cat ap_code.txt 2>/dev/null || echo "Unknown")
          CSC_CODE=$(cat csc_code.txt 2>/dev/null || echo "Unknown")
          BASE_TAG=$(date +"%d%m%Y_%H,%M,%S")
          RELEASE_TAG="$BASE_TAG"
          if gh release view "$RELEASE_TAG" &>/dev/null 2>&1; then
            SUFFIX=1
            while gh release view "${BASE_TAG}_${SUFFIX}" &>/dev/null 2>&1; do
              SUFFIX=$((SUFFIX + 1))
            done
            RELEASE_TAG="${BASE_TAG}_${SUFFIX}"
          fi
          {
            echo "ap_code=$AP_CODE"
            echo "csc_code=$CSC_CODE"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to GoFile
        if: ${{ inputs.upload_destination == 'gofile' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.fwinfo.outputs.release_tag }}
          AP_CODE: ${{ steps.fwinfo.outputs.ap_code }}
          CSC_CODE: ${{ steps.fwinfo.outputs.csc_code }}
          UPLOAD_DESTINATION: gofile
        run: bash scripts/upload_outputs.sh "$UPLOAD_DESTINATION" "$RELEASE_TAG" "$AP_CODE | $CSC_CODE"

      - name: Upload to GitHub Releases
        if: ${{ inputs.upload_destination == 'github releases' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.fwinfo.outputs.release_tag }}
          AP_CODE: ${{ steps.fwinfo.outputs.ap_code }}
          CSC_CODE: ${{ steps.fwinfo.outputs.csc_code }}
          UPLOAD_DESTINATION: github releases
        run: bash scripts/upload_outputs.sh "$UPLOAD_DESTINATION" "$RELEASE_TAG" "$AP_CODE | $CSC_CODE"

name: Validate repository

on:
  push:
    branches: ["0000"]
  pull_request:
    branches: ["0000"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh upload_gofile.sh; do
            bash -n "$script"
          done

      - name: Check shell errors
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/*.sh upload_gofile.sh

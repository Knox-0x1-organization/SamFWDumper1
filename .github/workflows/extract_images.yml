name: 1. Images Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'SamFW Direct Download Link'
        required: true
      compression:
        description: 'Compression level'
        required: true
        default: '0'
        type: choice
        options:
        - '0'
        - '3'
        - '6'
        - '9'
      upload_destination:
        description: 'Upload destination'
        required: true
        default: 'gofile'
        type: choice
        options:
        - 'gofile'
        - 'github releases'
      extract_system:
        description: 'system.img'
        type: boolean
        default: false
      extract_system_ext:
        description: 'system_ext.img'
        type: boolean
        default: false
      extract_product:
        description: 'product.img'
        type: boolean
        default: false
      extract_vendor:
        description: 'vendor.img'
        type: boolean
        default: false
      extract_vendor_boot:
        description: 'vendor_boot.img'
        type: boolean
        default: false
      extract_vendor_dlkm:
        description: 'vendor_dlkm.img'
        type: boolean
        default: false
      extract_system_dlkm:
        description: 'system_dlkm.img'
        type: boolean
        default: false
      extract_odm:
        description: 'odm.img'
        type: boolean
        default: false
      extract_odm_dlkm:
        description: 'odm_dlkm.img'
        type: boolean
        default: false
      extract_boot:
        description: 'boot.img'
        type: boolean
        default: false
      extract_init_boot:
        description: 'init_boot.img'
        type: boolean
        default: false
      extract_vbmeta:
        description: 'vbmeta.img'
        type: boolean
        default: false
      extract_vbmeta_system:
        description: 'vbmeta_system.img'
        type: boolean
        default: false
      extract_dtbo:
        description: 'dtbo.img'
        type: boolean
        default: false
      extract_recovery:
        description: 'recovery.img'
        type: boolean
        default: false

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            xz-utils \
            lz4 \
            unzip \
            curl \
            binutils \
            android-sdk-libsparse-utils

      - name: Make tools executable
        run: chmod +x tools/android-tools/* tools/erofs-utils/* upload_gofile.sh scripts/extract_images.sh

      - name: Run Images Extraction
        env:
          FIRMWARE_URL: ${{ inputs.url }}
          COMPRESSION: ${{ inputs.compression }}
          EXTRACT_SYSTEM: ${{ inputs.extract_system }}
          EXTRACT_SYSTEM_EXT: ${{ inputs.extract_system_ext }}
          EXTRACT_PRODUCT: ${{ inputs.extract_product }}
          EXTRACT_VENDOR: ${{ inputs.extract_vendor }}
          EXTRACT_VENDOR_BOOT: ${{ inputs.extract_vendor_boot }}
          EXTRACT_VENDOR_DLKM: ${{ inputs.extract_vendor_dlkm }}
          EXTRACT_SYSTEM_DLKM: ${{ inputs.extract_system_dlkm }}
          EXTRACT_ODM: ${{ inputs.extract_odm }}
          EXTRACT_ODM_DLKM: ${{ inputs.extract_odm_dlkm }}
          EXTRACT_BOOT: ${{ inputs.extract_boot }}
          EXTRACT_INIT_BOOT: ${{ inputs.extract_init_boot }}
          EXTRACT_VBMETA: ${{ inputs.extract_vbmeta }}
          EXTRACT_VBMETA_SYSTEM: ${{ inputs.extract_vbmeta_system }}
          EXTRACT_DTBO: ${{ inputs.extract_dtbo }}
          EXTRACT_RECOVERY: ${{ inputs.extract_recovery }}
        run: |
          PARTITIONS=""
          if [[ "$EXTRACT_SYSTEM" == "true" ]]; then PARTITIONS+=" system"; fi
          if [[ "$EXTRACT_SYSTEM_EXT" == "true" ]]; then PARTITIONS+=" system_ext"; fi
          if [[ "$EXTRACT_PRODUCT" == "true" ]]; then PARTITIONS+=" product"; fi
          if [[ "$EXTRACT_VENDOR" == "true" ]]; then PARTITIONS+=" vendor"; fi
          if [[ "$EXTRACT_VENDOR_BOOT" == "true" ]]; then PARTITIONS+=" vendor_boot"; fi
          if [[ "$EXTRACT_VENDOR_DLKM" == "true" ]]; then PARTITIONS+=" vendor_dlkm"; fi
          if [[ "$EXTRACT_SYSTEM_DLKM" == "true" ]]; then PARTITIONS+=" system_dlkm"; fi
          if [[ "$EXTRACT_ODM" == "true" ]]; then PARTITIONS+=" odm"; fi
          if [[ "$EXTRACT_ODM_DLKM" == "true" ]]; then PARTITIONS+=" odm_dlkm"; fi
          if [[ "$EXTRACT_BOOT" == "true" ]]; then PARTITIONS+=" boot"; fi
          if [[ "$EXTRACT_INIT_BOOT" == "true" ]]; then PARTITIONS+=" init_boot"; fi
          if [[ "$EXTRACT_VBMETA" == "true" ]]; then PARTITIONS+=" vbmeta"; fi
          if [[ "$EXTRACT_VBMETA_SYSTEM" == "true" ]]; then PARTITIONS+=" vbmeta_system"; fi
          if [[ "$EXTRACT_DTBO" == "true" ]]; then PARTITIONS+=" dtbo"; fi
          if [[ "$EXTRACT_RECOVERY" == "true" ]]; then PARTITIONS+=" recovery"; fi
          
          PARTITIONS="${PARTITIONS# }"
          
          if [ -z "$PARTITIONS" ]; then
            echo "[ERROR] No partitions selected! Please check at least one box."
            exit 1
          fi
          
          bash scripts/extract_images.sh \
            "$FIRMWARE_URL" \
            "$COMPRESSION" \
            "$PARTITIONS"

      - name: Get Firmware Info
        id: fwinfo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AP_CODE=$(cat ap_code.txt 2>/dev/null || echo "Unknown")
          CSC_CODE=$(cat csc_code.txt 2>/dev/null || echo "Unknown")
          BASE_TAG=$(date +"%d%m%Y_%H,%M,%S")
          RELEASE_TAG="$BASE_TAG"
          if gh release view "$RELEASE_TAG" &>/dev/null 2>&1; then
            SUFFIX=1
            while gh release view "${BASE_TAG}_${SUFFIX}" &>/dev/null 2>&1; do
              SUFFIX=$((SUFFIX + 1))
            done
            RELEASE_TAG="${BASE_TAG}_${SUFFIX}"
          fi
          echo "ap_code=$AP_CODE" >> $GITHUB_OUTPUT
          echo "csc_code=$CSC_CODE" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Upload to GoFile
        if: ${{ inputs.upload_destination == 'gofile' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.fwinfo.outputs.release_tag }}
          AP_CODE: ${{ steps.fwinfo.outputs.ap_code }}
          CSC_CODE: ${{ steps.fwinfo.outputs.csc_code }}
        run: |
          if [ ! -d "processed" ] || [ -z "$(ls -A processed)" ]; then
            echo "[ERROR] No files to upload"
            exit 1
          fi

          NOTES_FILE=$(mktemp)
          LINKS_FILE="links.txt"
          > "$LINKS_FILE"

          for FILE in processed/*; do
            [ -f "$FILE" ] || continue
            BASENAME=$(basename "$FILE")
            if bash upload_gofile.sh "$FILE"; then
              GOFILE_URL=$(cat download_url.txt)
              echo "${BASENAME}: ${GOFILE_URL}" >> "$NOTES_FILE"
              echo "${GOFILE_URL}" >> "$LINKS_FILE"
            else
              echo "${BASENAME}: [ERROR] GoFile upload failed" >> "$NOTES_FILE"
            fi
          done

          gh release create "$RELEASE_TAG" \
            --title "$AP_CODE | $CSC_CODE" \
            --notes-file "$NOTES_FILE" \
            "$LINKS_FILE"

          rm -f "$NOTES_FILE"

      - name: Upload to GitHub Releases
        if: ${{ inputs.upload_destination == 'github releases' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.fwinfo.outputs.release_tag }}
          AP_CODE: ${{ steps.fwinfo.outputs.ap_code }}
          CSC_CODE: ${{ steps.fwinfo.outputs.csc_code }}
        run: |
          if [ ! -d "processed" ] || [ -z "$(ls -A processed)" ]; then
            echo "[ERROR] No files to upload"
            exit 1
          fi

          NOTES_FILE=$(mktemp)
          ASSETS=()
          SIZE_LIMIT=2147483648

          for FILE in processed/*; do
            [ -f "$FILE" ] || continue
            FILESIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            PART_NAME=$(echo "$BASENAME" | sed 's/\.img.*//')

            if [ "$FILESIZE" -gt "$SIZE_LIMIT" ]; then
              if bash upload_gofile.sh "$FILE"; then
                GOFILE_URL=$(cat download_url.txt)
                echo "${PART_NAME}: ${GOFILE_URL}" >> "$NOTES_FILE"
              else
                echo "${PART_NAME}: [ERROR] GoFile upload failed" >> "$NOTES_FILE"
              fi
            else
              ASSETS+=("$FILE")
            fi
          done

          gh release create "$RELEASE_TAG" \
            --title "$AP_CODE | $CSC_CODE" \
            --notes-file "$NOTES_FILE" \
            "${ASSETS[@]}"

          rm -f "$NOTES_FILE"
          

name: 4. Full FWFetch

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'SamFW Direct Download Link'
        required: true

jobs:
  run:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free unused runner storage
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Record installed package versions
        run: |
          dpkg-query -W -f='${binary:Package}=${Version}\n' | grep -E '^(jq|xz-utils|lz4|unzip|curl|binutils|android-sdk-libsparse-utils|e2fsprogs|f2fs-tools|linux-modules-extra|shellcheck)(:|[-=])' | sort

      - name: Download and Upload
        env:
          FIRMWARE_URL: ${{ inputs.url }}
        run: bash scripts/full_fwfetch.sh "$FIRMWARE_URL"

      - name: Get Firmware Info
        id: fwinfo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AP_CODE=$(cat ap_code.txt 2>/dev/null || echo "Unknown")
          CSC_CODE=$(cat csc_code.txt 2>/dev/null || echo "Unknown")
          BASE_TAG=$(date +"%d%m%Y_%H,%M,%S")
          RELEASE_TAG="$BASE_TAG"
          if gh release view "$RELEASE_TAG" &>/dev/null 2>&1; then
            SUFFIX=1
            while gh release view "${BASE_TAG}_${SUFFIX}" &>/dev/null 2>&1; do
              SUFFIX=$((SUFFIX + 1))
            done
            RELEASE_TAG="${BASE_TAG}_${SUFFIX}"
          fi
          {
            echo "ap_code=$AP_CODE"
            echo "csc_code=$CSC_CODE"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release with GoFile Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.fwinfo.outputs.release_tag }}
          AP_CODE: ${{ steps.fwinfo.outputs.ap_code }}
          CSC_CODE: ${{ steps.fwinfo.outputs.csc_code }}
        run: |
          if [ ! -s download_url.txt ]; then
            echo "[ERROR] GoFile did not create a download URL."
            exit 1
          fi
          GOFILE_URL=$(<download_url.txt)
          case "$GOFILE_URL" in
            https://*) ;;
            *) echo "[ERROR] GoFile returned an invalid download URL."; exit 1 ;;
          esac
          NOTES_FILE=$(mktemp)
          echo "${GOFILE_URL}" > "$NOTES_FILE"
          gh release create "$RELEASE_TAG" \
            --title "$AP_CODE | $CSC_CODE" \
            --notes-file "$NOTES_FILE"
          rm -f "$NOTES_FILE"
          
